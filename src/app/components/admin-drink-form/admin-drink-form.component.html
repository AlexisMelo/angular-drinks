<h1>{{ drink ? 'Edit Drink' : 'Create Drink' }}</h1>
<div class="card">
  <div class="card-body">
    <form [formGroup]="drinkForm" (ngSubmit)="saveDrink()">
      <div class="mb-3">
        <label class="form-label" for="name">Name</label>
        <input type="text" formControlName="name" class="form-control" id="name">
      </div>
      <div class="mb-3">
        <label class="form-label" for="price">Price</label>
        <input type="number" formControlName="price" class="form-control" id="price">
      </div>
      <div class="mb-3">
        <label class="form-label" for="description">Description</label>
        <textarea class="form-control" formControlName="description" id="description"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label d-block" for="description">Category</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" formControlName="category" id="inlineRadio1" value="sweet">
          <label class="form-check-label" for="inlineRadio1">Sweet</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" formControlName="category" id="inlineRadio2" value="low-sugar">
          <label class="form-check-label" for="inlineRadio2">Low Sugar</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" formControlName="category" id="inlineRadio3" value="no-sugar">
          <label class="form-check-label" for="inlineRadio3">No Sugar</label>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="image">Image</label>
        <select class="form-control" id="image" formControlName="image">
          <option *ngFor="let image of drinksImageUrls" [value]="image">{{ image }}</option>
        </select>
      </div>
      <div class="text-end">
        <button type="button" class="btn btn-outline-secondary me-2" [routerLink]="['/admin/drinks']">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
